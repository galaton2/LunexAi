<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const tg=window.Telegram?.WebApp||{};
try{tg.expand&&tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.ready&&tg.ready();tg.setBackgroundColor&&tg.setBackgroundColor('#050508');tg.setHeaderColor&&tg.setHeaderColor('#050508')}catch(e){}
if(tg.BackButton){try{tg.BackButton.show();tg.BackButton.onClick(()=>{if(document.querySelector('.sheet.on'))closeAll();else location.href='index.html'})}catch(e){}}
const hap=k=>{try{tg.HapticFeedback&&(k==='ok'?tg.HapticFeedback.notificationOccurred('success'):tg.HapticFeedback.impactOccurred('light'))}catch(e){}};
/* тема из основного приложения */
const THEMES={pink:['255,71,126','#4a0d26'],blue:['64,156,255','#0d2a4a'],teal:['0,214,170','#0a3a33'],purple:['165,94,255','#2c0d4a'],orange:['255,149,0','#4a2a0d']};
function applyTheme(a){const t=THEMES[a]||THEMES.pink;document.documentElement.style.setProperty('--accent-rgb',t[0]);document.documentElement.style.setProperty('--accent-bg',t[1])}
try{applyTheme((JSON.parse(ls.g('lunexSettings'))||{}).accent)}catch(e){}

const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],WDF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

/* ---------- данные ---------- */
const DEF=()=>({v:3,ts:0,goal:8,bed:1380,wake:420,water:2000,glass:250,hour12:false,sessions:[],active:null,perm:{},wat:{},mood:{},wt:{},
 habits:[{id:'h1',n:'Витамины',i:'fa-capsules'},{id:'h2',n:'Прогулка',i:'fa-person-walking'},{id:'h3',n:'Без экрана перед сном',i:'fa-mobile-screen'}],hlog:{}});
let DB=(()=>{let d=DEF(),r;try{r=JSON.parse(ls.g('lunexHealthV3'))}catch(e){}
 if(!r){try{r=JSON.parse(ls.g('lunexSleepV2'))}catch(e){}}
 if(!r){try{const o=JSON.parse(ls.g('lunexSleepV1'));r={sessions:(o.sessions||[]).filter(s=>s.start&&s.end).map(s=>({id:'o'+s.start,start:s.start,end:s.end,src:'old'}))}}catch(e){}}
 return Object.assign(d,r||{})})();
let pushT;
const save=(quiet)=>{if(!quiet)DB.ts=Date.now();ls.s('lunexHealthV3',JSON.stringify(DB));clearTimeout(pushT);if(!quiet)pushT=setTimeout(()=>window.cloudPush&&window.cloudPush(DB),1500)};
window.cloudPull=h=>{if(!h||typeof h!=='object')return;if((h.ts||0)>DB.ts){DB=Object.assign(DEF(),h);save(true);render()}else if((h.ts||0)<DB.ts)window.cloudPush&&window.cloudPush(DB)};

/* ---------- утилиты времени ---------- */
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dFrom=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fMin=m=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60),mm=m%60;return DB.hour12?`${h%12||12}:${pad(mm)} ${h>=12?'PM':'AM'}`:`${pad(h)}:${pad(mm)}`};
const fT=t=>{const d=new Date(t);return fMin(d.getHours()*60+d.getMinutes())};
const dur=m=>{m=Math.max(0,Math.round(m));return Math.floor(m/60)+'ч '+pad(m%60)+'м'};
const toLI=t=>{const d=new Date(t);return dk(t)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;const unhm=s=>{const[a,b]=(s||'0:0').split(':').map(Number);return(a||0)*60+(b||0)};
const mins=s=>(s.end-s.start)/6e4;
const normBed=m=>m<720?m+1440:m;
const bedMin=s=>{const d=new Date(s.start);return normBed(d.getHours()*60+d.getMinutes())};
const GM=()=>DB.goal*60;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const std=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};

/* ---------- ночи и оценка ---------- */
function nights(){const m={};DB.sessions.forEach(s=>{const k=dk(s.end);if(!m[k]||mins(s)>mins(m[k]))m[k]=s});return m}
function lastNight(){return Object.values(nights()).sort((a,b)=>b.end-a.end)[0]}
function score(s){const d=mins(s),g=GM();let a=Math.min(d/g,1)*50;if(d>g+120)a-=Math.min(10,(d-g-120)/12);
 const diff=Math.abs(bedMin(s)-normBed(DB.bed));const b=Math.max(0,25-diff/6);const q=s.q?s.q/5*25:15;return Math.max(0,Math.min(100,Math.round(a+b+q)))}
const scCls=v=>v>=80?'sc-g':v>=60?'sc-y':'sc-r';
function series(n){const m=nights(),o=[];for(let i=n-1;i>=0;i--){const d=addD(new Date(),-i);o.push({d,k:dk(d),s:m[dk(d)]})}return o}
function regularity(list){if(list.length<3)return null;return Math.max(0,Math.round(100-std(list.map(bedMin))*.9))}
function debt(n){return series(n).filter(x=>x.s).reduce((a,x)=>a+Math.max(0,GM()-mins(x.s)),0)}

/* ---------- сон: отметки ---------- */
function sleep(){if(DB.active)return;DB.active={start:Date.now()};save();hap('ok');render();toast('Спокойной ночи. Экран можно выключить')}
function wake(){const a=DB.active;if(!a)return;const end=Date.now();stopPrecise();DB.active=null;
 if(end-a.start<20*6e4){save();render();return toast('Меньше 20 минут — не записано')}
 const id='s'+a.start;DB.sessions.push({id,start:a.start,end,src:a.precise?'precise':'tap',rest:a.rest});save();hap('ok');render();toast('Доброе утро! Сон сохранён');setTimeout(()=>openSleep(id),600)}

/* точный режим */
let wl=null,mvT=null,mvMax=0,lastMag=null,clkT=null;
const onDM=e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const m=Math.hypot(a.x,a.y,a.z);if(lastMag!=null)mvMax=Math.max(mvMax,Math.abs(m-lastMag));lastMag=m};
async function startPrecise(){if(DB.perm.motion!=='ok'){await askMotion();if(DB.perm.motion!=='ok')return toast('Разрешите датчики движения в Настройках')}
 DB.active={start:Date.now(),precise:true,rest:0};save();runPrecise();render()}
async function runPrecise(){addEventListener('devicemotion',onDM);
 mvT=setInterval(()=>{if(DB.active&&mvMax>.6){DB.active.rest=(DB.active.rest||0)+1;save(true)}mvMax=0},6e4);
 try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 $('nm').classList.add('on');const t=()=>$('nmc').textContent=fT(Date.now());t();clkT=setInterval(t,15000)}
function stopPrecise(){removeEventListener('devicemotion',onDM);clearInterval(mvT);clearInterval(clkT);try{wl&&wl.release()}catch(e){}wl=null;$('nm').classList.remove('on')}
const setP=(k,v)=>{DB.perm[k]=v;save();render()};
async function askMotion(){try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){if(await DeviceMotionEvent.requestPermission()!=='granted')return setP('motion','no')}
 const ok=await new Promise(res=>{let d=0;const fin=v=>{if(d)return;d=1;removeEventListener('devicemotion',f);res(v)};const f=e=>{const a=e.accelerationIncludingGravity;if(a&&a.x!=null)fin(true)};addEventListener('devicemotion',f);setTimeout(()=>fin(false),1500)});
 setP('motion',ok?'ok':'no')}catch(e){setP('motion','no')}}
async function askWake(){try{const l=await navigator.wakeLock.request('screen');l.release();setP('wake','ok')}catch(e){setP('wake','no')}}

/* ---------- Samsung Health CSV ---------- */
function csv(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';R.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
$('shFile').onchange=async e=>{let n=0;
 for(const fl of e.target.files){const R=csv(await fl.text());const hi=R.findIndex(r=>r.some(c=>/(^|\.)start_time$/.test(c)));if(hi<0)continue;
  const H=R[hi],col=x=>H.findIndex(c=>c===x||c.endsWith('.'+x));if(col('stage')>=0)continue;
  const si=col('start_time'),ei=col('end_time');if(si<0||ei<0)continue;
  const P=v=>Date.parse(v.trim().replace(' ','T')+(/Z|[+-]\d\d:?\d\d$/.test(v.trim())?'':'Z'));
  for(const r of R.slice(hi+1)){const a=P(r[si]||''),b=P(r[ei]||'');if(!(b>a))continue;const m=(b-a)/6e4;if(m<30||m>1200)continue;
   if(DB.sessions.some(s=>Math.abs(s.start-a)<6e5))continue;DB.sessions.push({id:'h'+a,start:a,end:b,src:'samsung'});n++}}
 e.target.value='';DB.sessions.sort((x,y)=>x.start-y.start);save();render();toast(n?'Импортировано ночей: '+n:'Не нашёл данных сна в файлах')};

/* ---------- ссылки для рутин ---------- */
const base=()=>location.origin+location.pathname;
function copy(a){const u=base()+'#'+a;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Ссылка скопирована'),()=>prompt('Скопируйте ссылку:',u))}
function intent(){const h=(location.hash||'').slice(1)||tg.initDataUnsafe?.start_param||new URLSearchParams(location.search).get('act');
 if(h==='sleep'&&!DB.active)sleep();else if(h==='wake'&&DB.active)wake();
 if(location.hash)history.replaceState(null,'',location.pathname+location.search)}

/* ---------- трекеры ---------- */
const TK=()=>dk(Date.now());
function addWater(v){const k=TK();DB.wat[k]=Math.max(0,(DB.wat[k]||0)+v);save();hap('light');render();if(v>0&&DB.wat[k]>=DB.water&&DB.wat[k]-v<DB.water){toast('Норма воды выполнена 💧');hap('ok')}}
function setMood(m){const k=TK();DB.mood[k]=Object.assign({},DB.mood[k],{m});save();hap('light');render()}
function setEnergy(e){const k=TK();DB.mood[k]=Object.assign({},DB.mood[k],{e});save();hap('light');render()}
function saveWeight(){const v=parseFloat(($('wIn').value||'').replace(',','.'));if(!(v>20&&v<400))return toast('Введите вес от 20 до 400 кг');DB.wt[TK()]=Math.round(v*10)/10;save();hap('ok');render();toast('Вес записан')}
function togH(id){const k=TK(),a=DB.hlog[k]||[];DB.hlog[k]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();hap('light');render()}
function habStreak(id){let n=0,d=new Date();if(!(DB.hlog[dk(d)]||[]).includes(id))d=addD(d,-1);while((DB.hlog[dk(d)]||[]).includes(id)){n++;d=addD(d,-1)}return n}
const HICONS=['fa-capsules','fa-person-walking','fa-dumbbell','fa-book','fa-brain','fa-mobile-screen','fa-mug-hot','fa-apple-whole','fa-leaf','fa-sun','fa-pills','fa-tooth'];
let hIc='fa-leaf';
function openHab(){$('hName').value='';hIc='fa-leaf';paintHI();openSheet('shHab')}
function paintHI(){$('hIcons').innerHTML=HICONS.map(i=>`<div class="chip ${i===hIc?'on':''}" onclick="hIc='${i}';paintHI()"><i class="fas ${i}" style="margin:0"></i></div>`).join('')}
function saveHabit(){const n=$('hName').value.trim();if(!n)return toast('Введите название');DB.habits.push({id:'h'+Date.now().toString(36),n,i:hIc});save();closeAll();render();hap('ok')}
function delHab(id){if(!confirm('Удалить привычку?'))return;DB.habits=DB.habits.filter(h=>h.id!==id);save();render()}
function habPct(k){const n=DB.habits.length;if(!n)return null;const a=(DB.hlog[k]||[]).filter(i=>DB.habits.some(h=>h.id===i)).length;return a/n}

/* ---------- итоговый балл дня ---------- */
function dayScore(){const k=TK(),parts=[];const n=nights()[k];if(n)parts.push([score(n),.4]);
 parts.push([Math.min(100,(DB.wat[k]||0)/DB.water*100),.25]);const h=habPct(k);if(h!==null)parts.push([h*100,.25]);
 const mo=DB.mood[k];if(mo&&mo.m)parts.push([mo.m*20,.1]);const w=parts.reduce((a,p)=>a+p[1],0);return w?Math.round(parts.reduce((a,p)=>a+p[0]*p[1],0)/w):0}

/* ---------- компоненты ---------- */
function ring(f,main,sub,sz){const r=88,c=2*Math.PI*r;return`<div class="ringbox" style="${sz?`width:${sz}px;height:${sz}px`:''}"><svg viewBox="0 0 216 216"><defs><linearGradient id="g${sz||0}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8a7ff"/><stop offset="1" stop-color="#ffc58a"/></linearGradient></defs><circle cx="108" cy="108" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="12"/><circle cx="108" cy="108" r="${r}" fill="none" stroke="url(#g${sz||0})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*Math.min(Math.max(f,0),1)} ${c}" transform="rotate(-90 108 108)"/></svg><div class="ringtxt"><b>${main}</b><span>${sub}</span></div></div>`}
function bars(vals,labels,goal,max,fmt,cls){const gb=goal?(goal/max)*100*.78:0;return`<div class="bars">${vals.map((v,i)=>{const h=v==null?3:Math.max(4,Math.min(v/max,1)*78);const low=goal&&v!=null&&v<goal*.9;return`<div class="bar ${v==null?'none':low?'low':''} ${cls||''}">${v!=null?`<em>${fmt(v)}</em>`:''}<i style="height:${h}%"></i><small>${labels[i]||''}</small></div>`}).join('')}${goal?`<div class="goalln" style="bottom:calc(${gb}% + 17px)"></div>`:''}</div>`}
function line(pts,color){if(pts.length<2)return'<div class="empty" style="padding:14px">Нужно минимум 2 записи</div>';const vs=pts.map(p=>p.v),mn=Math.min(...vs)-.5,mx=Math.max(...vs)+.5,W=300,H=100;
 const X=i=>8+i/(pts.length-1)*(W-16),Y=v=>H-8-(v-mn)/(mx-mn||1)*(H-24);const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 return`<svg class="ln" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L${X(pts.length-1)} ${H} L${X(0)} ${H} Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="${color}"/>`).join('')}</svg>`}

/* ---------- экран «Сегодня» ---------- */
function vToday(){const now=new Date(),a=DB.active,k=TK();const hr=now.getHours();const gr=hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер';
 let h=`<div class="date"><small>${WDF[now.getDay()]}, ${now.getDate()} ${MG[now.getMonth()]}</small><b>${gr}</b></div>`;
 /* напоминание об отбое */
 const nm=now.getHours()*60+now.getMinutes(),bd=((DB.bed-nm)+1440)%1440;
 if(!a&&bd<=60&&bd>=0)h+=`<div class="banner"><div class="bi"><i class="fas fa-moon"></i></div><div><small>Скоро отбой</small><b>${bd<=1?'Пора ложиться':'Через '+bd+' мин · '+fMin(DB.bed)}</b></div></div>`;
 else if(!a)h+=`<div class="banner"><div class="bi"><i class="fas fa-bed"></i></div><div><small>Режим сна</small><b>Отбой ${fMin(DB.bed)} · подъём ${fMin(DB.wake)}</b></div></div>`;
 /* герой */
 h+=`<div class="card hero">`;
 if(a){const m=(Date.now()-a.start)/6e4;
  h+=`<div class="cap">Вы спите с ${fT(a.start)}</div>${ring(m/GM(),dur(m),'цель '+DB.goal+'ч')}<button class="btn dawn" onclick="wake()"><i class="fas fa-sun"></i> Я проснулся</button><p class="hint">${a.precise?'Точный режим: экран включён':'Экран можно выключить — время считается по часам'}</p><button class="link" onclick="openActWake()">Проснулся раньше? Указать время</button>`}
 else{const n=lastNight();
  h+=n?`<div class="cap">${dk(n.end)===k?'Эта ночь':'Последняя ночь'} · <span class="${scCls(score(n))}">оценка ${score(n)}</span></div>${ring(mins(n)/GM(),dur(mins(n)),'из '+DB.goal+'ч')}<div class="times">${fT(n.start)} → ${fT(n.end)}</div>`
  :`<div class="cap">Пока нет записей</div>${ring(0,'—','из '+DB.goal+'ч')}<div class="times">&nbsp;</div>`;
  h+=`<button class="btn moon" onclick="sleep()"><i class="fas fa-moon"></i> Ложусь спать</button><p class="hint">Нажмите и выключайте экран. Утром — «Проснулся».</p><button class="link" onclick="startPrecise()">Точный режим с датчиками</button>`}
 h+=`</div>`;
 /* плитки */
 const w=DB.wat[k]||0,mo=DB.mood[k]||{},hp=habPct(k),wt=Object.keys(DB.wt).sort().pop();
 h+=`<div class="grid2">
 <div class="card tile" style="--c:var(--water)" onclick="addWater(DB.glass)"><div class="ti"><i class="fas fa-droplet"></i>Вода</div><div class="tv">${(w/1000).toFixed(2).replace(/\.?0+$/,'')||'0'}<small> / ${DB.water/1000} л</small></div><div class="ts">Нажмите: +${DB.glass} мл</div><div class="pbar"><i style="width:${Math.min(100,w/DB.water*100)}%"></i></div></div>
 <div class="card tile" onclick="go('track')"><div class="ti"><i class="fas fa-circle-check"></i>Привычки</div><div class="tv">${hp===null?'—':Math.round(hp*100)+'<small>%</small>'}</div><div class="ts">${DB.habits.length?(DB.hlog[k]||[]).filter(i=>DB.habits.some(x=>x.id===i)).length+' из '+DB.habits.length:'Добавьте первую'}</div><div class="pbar"><i style="width:${(hp||0)*100}%"></i></div></div>
 <div class="card tile" style="--c:var(--dawn)" onclick="go('track')"><div class="ti"><i class="fas fa-face-smile"></i>Настроение</div><div class="tv" style="font-size:30px">${mo.m?['😞','🙁','😐','🙂','😄'][mo.m-1]:'—'}</div><div class="ts">${mo.m?'Энергия '+(mo.e||'—')+'/5':'Отметить сейчас'}</div></div>
 <div class="card tile" style="--c:var(--green)" onclick="go('track')"><div class="ti"><i class="fas fa-weight-scale"></i>Вес</div><div class="tv">${wt?DB.wt[wt]:'—'}<small>${wt?' кг':''}</small></div><div class="ts">${wt?(wt===k?'Сегодня':'от '+dFrom(wt).getDate()+' '+MG[dFrom(wt).getMonth()]):'Записать'}</div></div>
 </div>`;
 /* балл дня */
 const ds=dayScore();
 h+=`<div class="card" style="display:flex;align-items:center;gap:16px"><div style="width:84px;height:84px;flex-shrink:0">${ring(ds/100,ds,'',84).replace('font-size:38px','')}</div><div style="min-width:0"><div class="cap" style="margin-bottom:4px">Индекс дня</div><div style="font-size:13px;color:var(--mute);line-height:1.5;font-weight:600">Сон, вода, привычки и настроение в одном числе. ${ds>=80?'Отличный день!':ds>=50?'Хорошо идёте.':'Есть куда расти — начните со стакана воды.'}</div></div></div>`;
 /* неделя */
 const s7=series(7);h+=`<h2 class="st"><span>Сон за неделю</span><span>${s7.filter(x=>x.s).length?'ср. '+dur(avg(s7.filter(x=>x.s).map(x=>mins(x.s)))):''}</span></h2><div class="card">${bars(s7.map(x=>x.s?mins(x.s)/60:null),s7.map(x=>WD[x.d.getDay()]),DB.goal,DB.goal*1.25,v=>v.toFixed(1),'moon')}</div>`;
 return h}

/* ---------- экран «Сон» ---------- */
let slR=7,calcWake=null;
function vSleep(){const s=series(slR),have=s.filter(x=>x.s),all=Object.values(nights()),rec=all.sort((a,b)=>b.end-a.end).slice(0,14);
 const rg=regularity(rec),dbt=debt(7);let h=`<div class="date"><small>Сон</small><b>Ваш режим</b></div>`;
 h+=`<div class="kpis"><div class="kpi"><b>${have.length?dur(avg(have.map(x=>mins(x.s)))):'—'}</b><span>В среднем</span></div><div class="kpi"><b>${rg===null?'—':rg+'%'}</b><span>Режим</span></div><div class="kpi"><b class="${dbt>120?'sc-r':dbt>0?'sc-y':'sc-g'}">${dbt?dur(dbt):'0'}</b><span>Долг за 7д</span></div></div>`;
 h+=`<div class="seg m"><button class="${slR===7?'on':''}" onclick="slR=7;render()">7 дней</button><button class="${slR===14?'on':''}" onclick="slR=14;render()">14 дней</button><button class="${slR===30?'on':''}" onclick="slR=30;render()">30 дней</button></div>`;
 const lab=s.map((x,i)=>slR===7?WD[x.d.getDay()]:(i%(slR>14?5:2)===0||i===s.length-1?x.d.getDate():''));
 h+=`<div class="card"><div class="ctitle">Продолжительность <span>цель ${DB.goal} ч</span></div>${bars(s.map(x=>x.s?mins(x.s)/60:null),lab,DB.goal,DB.goal*1.25,v=>slR>14?'':v.toFixed(1),'moon')}</div>`;
 if(have.length>=2){const bm=have.map(x=>bedMin(x.s)),wm=have.map(x=>{const d=new Date(x.s.end);return d.getHours()*60+d.getMinutes()});
  h+=`<div class="card tight"><div class="row"><div class="t">Обычно ложитесь</div><b>${fMin(avg(bm))}</b></div><div class="row"><div class="t">Обычно встаёте</div><b>${fMin(avg(wm))}</b></div><div class="row"><div class="t">Средняя оценка сна</div><b class="${scCls(avg(have.map(x=>score(x.s))))}">${Math.round(avg(have.map(x=>score(x.s))))}</b></div></div>`}
 /* калькулятор */
 const cw=calcWake??DB.wake,now=new Date();
 h+=`<h2 class="st"><span>Калькулятор сна</span><span>циклы по 90 мин</span></h2><div class="card"><div class="fl" style="margin-top:0">Хочу проснуться в</div><div style="display:flex;gap:10px;align-items:center"><input class="tin" type="time" value="${hm(cw)}" onchange="calcWake=unhm(this.value);render()"><span style="font-size:12px;color:var(--mute);font-weight:600;line-height:1.4">Лягте в одно из этих времён — проснётесь в конце цикла</span></div>`;
 [6,5,4].forEach((c,i)=>{const b=cw-c*90-15;h+=`<div class="calc-r ${i===0?'best':''}"><span><i class="fas fa-moon" style="color:var(--moon);margin-right:8px"></i>${fMin(b)}</span><small>${c} цикл. · ${c*1.5} ч</small></div>`});
